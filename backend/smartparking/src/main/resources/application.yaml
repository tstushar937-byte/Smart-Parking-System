spring:
  application:
    name: smartparking

  datasource:
    url: jdbc:mysql://localhost:3306/smartparking
    username: root
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

admin:
  setup-secret: ${ADMIN_SETUP_SECRET}